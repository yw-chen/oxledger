[workspace]
resolver = "3"
members = ["crates/ox-core", "crates/oxledger"]

[workspace.package]
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/yw-chen/oxledger"
version = "0.1.0"

# Argon2 is unusably slow unoptimized (each login verifies a 19 MiB hash); optimize it in dev/test too.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# SCRAM-SHA-256 (sqlx's Postgres login: 4096 HMAC-SHA-256 rounds per connection).
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3
