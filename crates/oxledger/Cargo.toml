[package]
name = "oxledger"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Direct-insert helpers for tests and `oxledger seed-demo` (src/test_support.rs).
# Off in normal builds so production code cannot write around the command engine.
test-support = []
# The GitHub REST client (contract 02 §19, S6b.8): HTTPS (rustls with the
# ring provider) and RS256 for the App JWT. Off by default; without it the
# webhook still works and the worker uses `client::NoGithub`.
github = ["dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:rustls", "dep:webpki-roots", "dep:ring", "dep:http-body-util"]
# The built-in AI chat's provider client (design 05 §3.13.2 P-7): the same
# HTTPS stack as `github`, no new crate. Off by default; without it a run
# ends with `ai_unavailable` (`not_configured`).
ai = ["dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:rustls", "dep:webpki-roots", "dep:http-body-util"]

[dependencies]
ammonia = "=4.2.4"
anyhow = "1.0.104"
argon2 = "0.5"
axum = "0.8.9"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = "0.4.45"
# Markdown (design 06 §3.2; D17 approved 2026-11-13). No CLI, no syntax highlighting.
comrak = { version = "=0.59.0", default-features = false }
csv = "=1.4.0"
encoding_rs = "=0.8.44"
# Attachments (design 06 §2.4, R-A2): free space of the files directory.
fs4 = "0.13.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
hmac = "0.13"
percent-encoding = "2.3.2"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", optional = true, features = ["client", "http1"] }
hyper-rustls = { version = "0.27", optional = true, default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1.21", optional = true, features = ["client-legacy", "http1", "tokio"] }
ox-core = { version = "0.1.0", path = "../ox-core" }
rand = "0.9"
ring = { version = "0.17", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "=3.2.1"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2"
tantivy = "0.27.0"
tokio = { version = "1.54.1", features = ["full"] }
# Request limits and webhook load shedding (design 06 §3.7, B-32); was a dev-dependency.
tower = { version = "0.5", features = ["util", "limit", "load-shed"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "=0.1.26"
url = "2"
uuid = { version = "1.29.0", features = ["serde", "v7"] }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
# Golden tests (docs/research/09b G1/G2): no `redactions` (it pulls pest;
# tests/common/snap.rs normalizes instead).
insta = { version = "=1.49.0", default-features = false, features = ["json", "glob"] }
# Invariants next to the golden tests (09b G13).
proptest = "1.12.0"
# Integration tests need the test-support helpers.
oxledger = { path = ".", features = ["test-support"] }
