[package]
name = "oxledger"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Direct-insert helpers for tests and `oxledger seed-demo` (src/test_support.rs).
# Off in normal builds so production code cannot write around the command engine.
test-support = []

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
hex = "0.4.3"
ox-core = { version = "0.1.0", path = "../ox-core" }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tantivy = "0.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[dev-dependencies]
# Integration tests need the test-support helpers.
oxledger = { path = ".", features = ["test-support"] }
