<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oxledger 流程模擬</title>
<style>
:root{
  --bg:#0B1220;--bg2:#0F1829;--card:#142033;--card2:#1A2840;--line:#24344F;--line2:#30466A;
  --fg:#F1F5F9;--muted:#B6C2D3;--dim:#7D8BA1;
  --act:#67E8F9;--prop:#C4B5FD;--ok:#6EE7B7;--warn:#FCD34D;--bad:#FDA4AF;
  --act-a:rgba(103,232,249,.13);--prop-a:rgba(196,181,253,.13);--ok-a:rgba(110,231,183,.13);--warn-a:rgba(252,211,77,.11);--bad-a:rgba(253,164,175,.11);
  --glow:0 0 0 1px rgba(103,232,249,.25),0 8px 30px -12px rgba(103,232,249,.35);
  --term:#070C16;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F4F7FB;--bg2:#EAF0F7;--card:#FFFFFF;--card2:#F2F6FB;--line:#D5DFEC;--line2:#B9C8DC;
  --fg:#0E1726;--muted:#3E4C63;--dim:#66748A;
  --act:#0E7490;--prop:#6D28D9;--ok:#047857;--warn:#A16207;--bad:#BE123C;
  --act-a:rgba(14,116,144,.10);--prop-a:rgba(109,40,217,.08);--ok-a:rgba(4,120,87,.10);--warn-a:rgba(161,98,7,.10);--bad-a:rgba(190,18,60,.08);
  --glow:0 0 0 1px rgba(14,116,144,.2),0 8px 24px -14px rgba(14,116,144,.35);--term:#0E1726;
}}
:root[data-theme="light"]{
  --bg:#F4F7FB;--bg2:#EAF0F7;--card:#FFFFFF;--card2:#F2F6FB;--line:#D5DFEC;--line2:#B9C8DC;
  --fg:#0E1726;--muted:#3E4C63;--dim:#66748A;
  --act:#0E7490;--prop:#6D28D9;--ok:#047857;--warn:#A16207;--bad:#BE123C;
  --act-a:rgba(14,116,144,.10);--prop-a:rgba(109,40,217,.08);--ok-a:rgba(4,120,87,.10);--warn-a:rgba(161,98,7,.10);--bad-a:rgba(190,18,60,.08);
  --glow:0 0 0 1px rgba(14,116,144,.2),0 8px 24px -14px rgba(14,116,144,.35);--term:#0E1726;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.65 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.mono,code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.chip{display:inline-block;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid currentColor;white-space:nowrap;line-height:19px}
.c-act{color:var(--act)}.c-prop{color:var(--prop)}.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-dim{color:var(--dim)}
.k{font:600 10.5px ui-monospace,Consolas,monospace;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}

/* top */
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-weight:400;color:var(--dim);font-size:12px}
.weeks{display:flex;gap:2px;flex:1;min-width:260px}
.weeks div{flex:1;height:26px;border-radius:5px;background:var(--card);border:1px solid var(--line);font:600 11px ui-monospace,Consolas,monospace;color:var(--dim);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.weeks div.past{color:var(--muted);background:var(--card2)}
.weeks div.now{color:var(--bg);background:var(--act);border-color:var(--act)}
.toggles{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.tg{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.tg input{accent-color:var(--act)}
.themeb{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}

/* layout */
.wrap{max-width:1360px;margin:0 auto;padding:14px 16px 60px;display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:14px;align-items:start}
nav.ch{position:sticky;top:70px;max-height:calc(100vh - 84px);overflow:auto;padding-right:4px}
nav.ch .grp{margin:0 0 8px}
nav.ch .gt{font:600 11px ui-monospace,Consolas,monospace;color:var(--dim);margin:8px 0 3px;letter-spacing:.05em}
nav.ch button{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid var(--line);padding:3px 8px;font-size:13px;color:var(--muted);cursor:pointer}
nav.ch button:hover{color:var(--fg)}
nav.ch button.on{border-left-color:var(--act);color:var(--fg);background:var(--act-a)}
nav.ch button.done{color:var(--dim)}

/* app frame */
.frame{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:var(--glow)}
.fbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.dots3{display:flex;gap:5px}.dots3 i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.where{font-size:12.5px;color:var(--dim)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--bg)}
.aiflag{font-size:11.5px}
.fbody{padding:14px}
.cmd{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;margin-bottom:12px}
.cmd .kbd{font:600 11px ui-monospace,Consolas,monospace;border:1px solid var(--line2);border-radius:5px;padding:0 6px;color:var(--muted)}
.cmd .tx{flex:1;min-height:22px}
.cmd .tx.ph{color:var(--dim)}
.caret{display:inline-block;width:2px;height:15px;background:var(--act);vertical-align:-2px;margin-left:1px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.intent{font-size:11.5px}
.banner{border-radius:8px;padding:7px 12px;margin:0 0 10px;font-size:13px;display:flex;gap:8px;align-items:center}
.banner.p{background:var(--prop-a);border:1px dashed var(--prop)}
.banner.w{background:var(--warn-a);border:1px solid var(--warn)}
.banner.o{background:var(--ok-a);border:1px solid var(--ok)}
.banner.b{background:var(--bad-a);border:1px solid var(--bad)}
.sec{margin:12px 0 4px}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:5px 0;flex-wrap:wrap}
.row .r{margin-left:auto;color:var(--dim);font-size:12px}
.row.prop{border-style:dashed;border-color:var(--prop)}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.qs span{border:1px solid var(--line2);border-radius:99px;padding:0 10px;font-size:12px;color:var(--muted)}
.cols{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.box h5{margin:0 0 6px;font-size:13px}
.box ul{margin:0;padding-left:18px}
.box li{margin:2px 0}
table.t{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.t th,table.t td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{color:var(--dim);font-size:11.5px;font-weight:600;background:var(--card2)}
table.t tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.old{color:var(--dim);text-decoration:line-through}
.new{color:var(--prop);font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--act)}
.btn.pri{border-color:var(--act);background:var(--act-a);font-weight:600}
.btn.okb{border-color:var(--ok);background:var(--ok-a);font-weight:600}
.btn.danger{border-color:var(--bad);background:var(--bad-a);font-weight:600}
.small{font-size:12px;color:var(--dim)}
.why{display:none;margin-top:6px;font-size:12.5px;color:var(--muted);border-left:2px solid var(--prop);padding-left:8px}
.why.on{display:block}
.lnk{background:none;border:0;color:var(--act);cursor:pointer;padding:0;font-size:12.5px;text-decoration:underline}

/* sources ripple */
.src{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--card2);position:relative;margin:4px 0;font-size:13px}
.src .st{margin-left:auto;font-size:11.5px;color:var(--dim)}
.src.fetch::after{content:"";position:absolute;inset:-1px;border-radius:8px;border:1.5px solid var(--act);animation:srcr .45s ease-out forwards;pointer-events:none}
@keyframes srcr{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.05,1.4)}}
.src.done .st{color:var(--ok)}
.hit{position:relative}
.hit::after{content:"";position:absolute;inset:-1px;border-radius:inherit;animation:okr .34s ease-out forwards;pointer-events:none}
@keyframes okr{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 70%,transparent)}to{box-shadow:0 0 0 14px transparent}}
.gated{opacity:.0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.gated.show{opacity:1;transform:none}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.colb{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px}
.colb h6{margin:0 0 6px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.cardi{border:1px solid var(--line2);background:var(--card2);border-radius:7px;padding:6px 8px;margin:5px 0;font-size:12.5px}
.cardi.ghost{border:1.5px dashed var(--prop);background:var(--prop-a)}
.cardi .lab{font-size:11px;color:var(--prop);font-weight:600}
.cap{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;margin:4px 0 2px}
.cap i{display:block;height:100%}

/* terminal */
.term{background:var(--term);color:#D5E2F0;border-radius:10px;padding:12px 14px;font:12.5px/1.6 ui-monospace,Consolas,monospace;overflow-x:auto;border:1px solid var(--line2)}
.term .p{color:#67E8F9}.term .d{color:#7D8BA1}.term .g{color:#6EE7B7}.term .y{color:#FCD34D}.term .v{color:#C4B5FD}
.term .ln{white-space:pre-wrap;opacity:0;transition:opacity .2s}.term .ln.show{opacity:1}

/* side */
aside.side{position:sticky;top:70px;display:flex;flex-direction:column;gap:10px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sc h3{margin:2px 0 6px;font-size:16px;line-height:1.35}
.sc p{margin:4px 0;font-size:13.5px;color:var(--muted)}
.sc .trad{font-size:13px;color:var(--dim);border-left:2px solid var(--line2);padding-left:8px;margin-top:8px}
.sc ul{margin:4px 0 0;padding-left:16px;font-size:13px;color:var(--muted)}
.sc li{margin:3px 0}
.caps{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.capi{font:12px ui-monospace,Consolas,monospace;border:1px solid var(--line2);border-radius:6px;padding:0 6px;display:flex;gap:5px;align-items:center}
.capi b{font-size:10.5px;font-weight:700}
.nav2{display:flex;gap:8px;align-items:center}
.nav2 .btn{flex:1}
.prog{font:12px ui-monospace,Consolas,monospace;color:var(--dim);text-align:center}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font:700 22px ui-monospace,Consolas,monospace;color:var(--act)}
.stat span{font-size:12px;color:var(--dim)}

@media (max-width:1100px){
  .wrap{grid-template-columns:minmax(0,1fr) 300px}
  nav.ch{display:none}
}
@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside.side{position:static}
  .fbar{flex-wrap:wrap}.dots3{display:none}.who{margin-left:0}.who .small{display:none}
  .cols,.board{grid-template-columns:1fr}
  .weeks{order:3;min-width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .gated{opacity:1;transform:none}
  .term .ln{opacity:1}
}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand">oxledger 流程模擬<small>開發案：AUTH「登入改版 v2.0（支援 SSO）」· 示範資料</small></div>
  <div class="weeks" id="weeks" aria-label="專案週次"></div>
  <div class="toggles">
    <label class="tg"><input type="checkbox" id="tgAi" checked> AI 可用</label>
    <label class="tg"><input type="checkbox" id="tgConf"> 模擬衝突</label>
    <button class="themeb" id="themeBtn" type="button">◐ 主題</button>
  </div>
</div></header>

<div class="wrap">
  <nav class="ch" id="chnav" aria-label="章節"></nav>
  <section>
    <div class="frame">
      <div class="fbar">
        <div class="dots3"><i></i><i></i><i></i></div>
        <span class="where" id="where"></span>
        <div class="who" id="who"></div>
      </div>
      <div class="fbody" id="stage"></div>
    </div>
    <p class="small" style="margin:10px 2px">這是設計模擬，不是產品程式碼。人物、編號、數字都是虛構的示範資料。右上角可以關掉「AI 可用」看沒有 AI 時的退路，或打開「模擬衝突」看套用失敗時的畫面。鍵盤 ← → 可以切換步驟。</p>
  </section>
  <aside class="side">
    <div class="sc">
      <div class="k" id="sStep"></div>
      <h3 id="sTitle"></h3>
      <p id="sWhat"></p>
      <div class="trad" id="sTrad"></div>
    </div>
    <div class="sc">
      <div class="k">這一步用到的設計原則</div>
      <ul id="sRules"></ul>
    </div>
    <div class="sc">
      <div class="k">需要的後端能力</div>
      <div class="caps" id="sCaps"></div>
      <p class="small" style="margin-top:6px"><b class="c-ok">M0</b> 已有 · <b class="c-act">規劃</b> 研究文件已規劃 · <b class="c-prop">新增</b> 這次設計新增</p>
    </div>
    <div class="nav2">
      <button class="btn" id="prevB" type="button">← 上一步</button>
      <span class="prog" id="prog"></span>
      <button class="btn pri" id="nextB" type="button">下一步 →</button>
    </div>
  </aside>
</div>

<script>
(function(){
var S={ai:true,conf:false,i:0};
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var PEOPLE={
  alice:{n:'alice',r:'PM（Manager）',c:'#67E8F9'},
  bob:{n:'bob',r:'後端開發',c:'#6EE7B7'},
  dave:{n:'dave',r:'前端開發',c:'#FCD34D'},
  carol:{n:'carol',r:'QA（Reporter）',c:'#FDA4AF'},
  admin:{n:'admin',r:'管理員',c:'#C4B5FD'},
  agent:{n:'Claude Code',r:'bob 委派的外部 agent（MCP）',c:'#B6C2D3'}
};
function C(cls,t){return '<span class="chip '+cls+'">'+t+'</span>'}
function M(t){return '<span class="mono">'+t+'</span>'}
function cmd(t,intent){return '<div class="cmd"><span class="kbd">⌘K</span><span class="tx" data-type="'+t.replace(/"/g,'&quot;')+'"></span>'+(intent?'<span class="intent '+(S.ai?'c-act':'c-dim')+'">'+(S.ai?'意圖：'+intent:'搜尋')+'</span>':'')+'</div>'}
function srcs(list){return '<div class="k sec">AI 擷取的來源（只限你看得到的）</div><div class="srcs" data-auto>'+list.map(function(s){return '<div class="src"><span class="mono">'+s[0]+'</span><span>'+s[1]+'</span><span class="st">待擷取</span></div>'}).join('')+'</div>'}
function gated(h){return '<div class="gated">'+h+'</div>'}
function diff(rows){return '<div class="tw"><table class="t"><tr><th>目標</th><th>欄位</th><th>目前</th><th>套用後</th></tr>'+rows.map(function(r){return '<tr><td>'+M(r[0])+'</td><td>'+r[1]+'</td><td class="old">'+r[2]+'</td><td class="new">'+r[3]+'</td></tr>'}).join('')+'</table></div>'}
function btns(arr){return '<div class="btns">'+arr.map(function(b){return '<button type="button" class="btn '+(b[1]||'')+'" data-act="'+(b[2]||'next')+'">'+b[0]+'</button>'}).join('')+'</div>'}
function receipt(title,items){return '<div class="banner o">'+C('c-ok','server 回執')+' '+title+'</div>'+items.map(function(t){return '<div class="row hitme">'+C('c-ok','✓ 已寫入')+'<span>'+t+'</span></div>'}).join('')}
function noAi(text){return '<div class="banner w">'+C('c-warn','AI 暫時無法使用')+' 資料與操作正常。'+text+'</div>'}

var STEPS=[
/* 1 */{ch:'開案',w:0,who:'alice',where:'oxledger · 首頁',
 title:'首頁：從「需要你決定的事」開始',
 what:'專案剛建立，alice 打開首頁。首頁頂端是意圖列，下面是「需要你決定」「繼續處理」「我的工作」。這些都由規則和事件產生，打開首頁不會呼叫模型。',
 trad:'傳統：首頁是 dashboard 或「指派給我」的列表。',
 rules:['首頁以決定與例外為中心（§6）','還沒經過模型的項目不標成「AI 建議」','沒有待決定的事不是缺陷，不硬補內容'],
 caps:[['search','M0'],['ChangeSet 查詢','新增'],['attention items','新增']],
 body:function(){return cmd('','')+
  '<div class="qs"><span>回報問題</span><span>整理待分流</span><span>找相關紀錄</span><span>規劃 sprint</span></div>'+
  '<div class="k sec">需要你決定</div>'+
  '<div class="row">'+C('c-dim','可協助分析')+'<span>'+M('AUTH')+' 專案已建立，還沒有 workflow 規則和 backlog</span><span class="r">規則</span></div>'+
  '<div class="k sec">繼續處理</div><div class="row"><span class="small">目前沒有未完成的任務</span></div>'+
  '<div class="k sec">我的工作</div><div class="row">'+C('c-dim','view')+'<span>指派給我 · 我關注 · 最近的 view</span></div>'+
  btns([['交給管理員設定流程 →','pri']])}},

/* 2 */{ch:'管理員設定',w:0,who:'admin',where:'oxledger · 管理 › 流程',
 title:'管理員用一句話描述規則，先模擬再發布',
 what:'admin 描述 QA 驗證規則。系統產出三份東西：設定草稿 diff、對現有資料的影響報告、角色 × 狀態的測試案例。這時還沒有任何東西生效。',
 trad:'傳統：逐頁改欄位、角色、轉移矩陣，存檔就生效，影響要自己推想。',
 rules:['管理設定先模擬再發布（§5.7）','改顯示名稱和改型別、合法值是不同的風險等級','改流程不會偷偷搬動既有 issue 的狀態'],
 caps:[['describe','新增'],['管理設定版本化','新增'],['影響分析','新增']],
 body:function(){
  if(!S.ai) return noAi('意圖列退化成搜尋，管理員改用原本的設定頁。')+
   '<div class="tw"><table class="t"><tr><th>Bug 的轉移</th><th>Developer</th><th>QA</th><th>Reporter</th></tr><tr><td>修正中 → 待驗證</td><td>✓</td><td>✓</td><td>—</td></tr><tr><td>待驗證 → 已驗證</td><td><label><input type="checkbox" checked> </label></td><td><label><input type="checkbox" checked> </label></td><td>—</td></tr></table></div>'+
   '<p class="small">設定頁照常可用。模擬和影響報告是領域功能，不需要模型，所以仍然看得到。</p>'+btns([['模擬並發布 →','pri']]);
  return cmd('Bug 進「待驗證」前必須填「修正版本」，只有 QA 能把 Bug 轉成「已驗證」','管理設定')+

/* G */{ch:'開發中',w:2,who:'agent',where:'bob 的終端機 · Claude Code ↔ oxledger MCP（view.*）',

  '<rect x="420" y="183" width="80" height="24" rx="4" fill="var(--card2)" stroke="var(--line2)"/><text x="460" y="199" class="mono">8c1d0e2</text>'+

/* 10 */{ch:'回報與分流',w:3,who:'carol',where:'oxledger · 首頁',
 title:'carol 回報 bug：先分清事實和推測，送出前先找重複',
 what:'carol 只貼一段描述。AI 把內容分成「你明說的」和「待確認」，預填欄位並附依據；沒把握的 priority 留白。送出前在 carol 看得到的範圍內找相似單，找到已關閉的 AUTH-88。',
 trad:'傳統：選專案、選 tracker、填完整張表單；重複的單事後才被發現。',
 rules:['只追問會影響處理的缺漏（§5.1）','可能重複 ≠ 關閉為重複','不能把私有內容複製到公開描述'],
 caps:[['search','M0'],['resolve','M0'],['describe','新增'],['create_issue','規劃'],['ChangeSet','新增']],

  if(!S.ai) return cmd('登入後跳回登入頁','')+noAi('意圖列只做搜尋：找到 AUTH-88。')+
   '<div class="box"><h5>新 issue（直接填表）</h5><p class="small">專案 [AUTH ▾] · 類型 [Bug ▾] · 標題 [______] · 描述 [______]</p><p class="small">送出前一樣會用 BM25 列出相似單，不需要模型。</p></div>'+btns([['送出 →','pri']]);
  return cmd('登入後會跳回登入頁，只有 Safari 會，昨天開始','回報')+
  srcs([['AUTH-88','OAuth callback Safari 失敗（已關閉）'],['AUTH-141','OIDC 授權碼流程（修正中）']])+
  gated('<div class="cols" style="margin-top:10px"><div class="box"><h5>你明說的</h5><ul><li>登入後被導回登入頁</li><li>只有 Safari</li><li>昨天開始</li></ul></div>'+
  '<div class="box"><h5>'+C('c-warn','待確認')+'</h5><ul><li>Safari 版本？</li><li>用 SSO 還是帳密登入？</li></ul><p class="small">「昨天開始」不會被寫成「確認是部署造成的回歸」</p></div></div>'+
  '<div class="tw" style="margin-top:8px"><table class="t"><tr><th>欄位</th><th>值</th><th>依據</th></tr>'+
  '<tr><td>專案</td><td>AUTH '+C('c-prop','AI 建議')+'</td><td class="small">你目前在 AUTH 的工作區；內容提到登入 <button class="lnk" type="button">改選</button></td></tr>'+
  '<tr><td>類型</td><td>Bug '+C('c-prop','AI 建議')+'</td><td class="small">描述的是非預期行為</td></tr>'+
  '<tr><td>priority</td><td class="c-dim">留白</td><td class="small">根據不足，由分流決定</td></tr></table></div>'+
  '<div class="k sec">可能重複（還沒建立關係）</div><div class="cols"><div class="box"><h5>'+M('AUTH-88')+' 已關閉</h5><p class="small">相同：callback 後回到登入頁<br>不同：AUTH-88 是 Chrome 舊版、2026-08 修正</p></div><div class="box"><h5>你的回報</h5><p class="small">Safari、昨天開始、OIDC 上線後</p></div></div>'+
  btns([['建立新 issue →','pri'],['補充到 AUTH-88','', 'next'],['存成草稿','','next']]))}},

/* 12 */{ch:'回報與分流',w:3,who:'alice',where:'oxledger · 分流工作台',

  '<tr><td><input type="checkbox" aria-label="選取 AUTH-133"></td><td>'+M('AUTH-133')+'<br><span class="small">登入很慢</span></td><td>'+(S.ai?'<span class="c-dim">根據不足</span>':'—')+'</td><td>'+(S.ai?C('c-prop','AI')+' 沒有足夠依據，不硬給建議':'')+'</td><td class="small">哪個頁面？多慢？</td></tr></table></div>'+
  '<div class="k sec">選取的 1 筆 · 套用前 diff</div>'+
  diff([['AUTH-131','負責人','—','bob'],['AUTH-131','priority','Normal',S.ai?'High':'Normal']].concat([['AUTH-131','影響版本','—','v2.0-rc1']]).filter(function(r){return r[2]!==r[3]}))+
  btns([['套用選取的 1 筆 →','okb']])}},

/* 14 */{ch:'每日站會',w:3,who:'bob',where:'oxledger · 我的站會',

/* 15 */{ch:'追進度與風險',w:4,who:'alice',where:'oxledger · AUTH',

  var items=[['c-bad','已逾期','規則',M('AUTH-142')+' 帳號連結','到期 11/20，今天 11/24','被 WEB-7 擋住 7 天','WEB-7 負責人是否已在處理','請 WEB-7 負責人更新'],

  gated('<div class="box" style="margin-top:10px"><h5>v2.0 發布說明（草稿）</h5><ul><li>新增 SSO 登入（OIDC），支援既有帳號綁定 <span class="small">［AUTH-140、141、142］</span></li><li>登入頁加上 IdP 按鈕，暗色模式可讀性修正 <span class="small">［AUTH-143、132］</span></li><li>修正 Safari 登入後被導回登入頁 <span class="small">［AUTH-131 · commit 8c1d0e2］</span></li></ul></div>'+
  '<div class="banner w" style="margin-top:8px">'+C('c-warn','受限來源')+' 有 1 筆私有 issue 的內容沒有納入草稿。這一行只有有權限的人看得到；發布出去的版本不會出現。</div>'+
  '<div class="box" style="border-color:var(--bad)"><h5 class="c-bad">強確認：對外發布</h5><p class="small" style="margin:0">將發布到公開 wiki「Release notes」並通知 3 位關注者。發布後無法收回已讀內容。</p><label class="small"><input type="checkbox" id="cfm"> 我已確認內容不含內部資訊</label></div>'+
  btns([['發布 →','danger','publish']])+'<div class="small" id="pubres" style="margin-top:6px"></div>')}},

/* 20 */{ch:'總結',w:6,who:'alice',where:'oxledger · AUTH › 專案回顧',
 title:'整個開發案下來，AI 做了什麼、人決定了什麼',
 what:'回顧頁統計所有 ChangeSet 的來源和結果。衡量的是更正率、審閱時間、恢復成本，不是 AI 建議的接受率。下面的數字是示意，不是量測結果。',
 trad:'',
 rules:['不追求最大接受率（§8 D6）','觀察數據只當設計訊號，不做成個人分數'],
 caps:[['issue_events + ChangeSet','新增']],
 body:function(){return '<div class="stats">'+
  [['41','ChangeSet 總數'],['17','AI 提案'],['6','外部 agent 提案'],['18','人工直接操作'],['3','提案被部分修改後套用'],['2','衝突重新審閱'],['1','補償'],['0','自動套用（政策未開放）']].map(function(s){return '<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join('')+'</div>'+
  '<div class="k sec">這個案子走過的流程</div><div class="tw"><table class="t"><tr><th>週</th><th>情境</th><th>主要互動</th></tr>'+
  '<tr><td>W0</td><td>管理員設定、拆需求</td><td>設定草稿 + 影響報告 + 測試案例；批次建立 ChangeSet</td></tr>'+
  '<tr><td>W1</td><td>sprint 規劃</td><td>規劃模式、紫色虛線提案卡、未估點另外列出</td></tr>'+
  '<tr><td>W2</td><td>開發中</td><td>外部 agent 經 MCP 提案，人在 SPA 核准</td></tr>'+
  '<tr><td>W3</td><td>回報、分流、站會</td><td>事實與待確認分開、可能重複、規則先於 AI、衝突重審、站會只看阻礙</td></tr>'+
  '<tr><td>W4</td><td>風險、找紀錄</td><td>事實和判斷分開；同一問句依可見範圍給不同結果</td></tr>'+
  '<tr><td>W5</td><td>出錯、AI 故障</td><td>補償提案；退化成搜尋加指令</td></tr>'+
  '<tr><td>W0–W5</td><td>多種視圖</td><td>mindmap 三種節點；agent 用 view.* 操控 graph 並截圖；Gantt 由計算器順延；BPMN 圖件只對真正的工作提案</td></tr>'+
  '<tr><td>W6</td><td>發布</td><td>引用 commit、排除私有內容、強確認</td></tr></table></div>'+
  '<p class="small">設計細節見 <a href="01-ai-native-ux.html">01-ai-native-ux.html</a> 和 <a href="01-ai-native-ux.md">01-ai-native-ux.md</a>。</p>'+
  btns([['從頭再看一次','', 'restart']])}}
];

/* ---------- render ---------- */
var TAGS=["第一切片：待審 ChangeSet · 目標設計：提醒規則", "目標設計：管理設定版本化（M2 以後）", "目標設計：管理設定版本化", "目標設計：多目標 atomic＋多個 bind＋parent 關係", "目標設計：多目標 atomic", "目標設計：mindmap 視圖（M1 後續）", "目標設計：sprint／容量模型（Q5）＋多目標 atomic", "目標設計：多目標 atomic", "第一切片：agent 只能提案", "第一切片：核准並套用", "目標設計：view.*、render（M1 後續）", "第一切片：只收文字", "第一切片", "第一切片：單筆分流", "第一切片", "目標設計：events_since", "目標設計：提醒規則、neighborhood", "目標設計：排程計算器、工作日曆（M3）", "第一切片：search（explain 縮小版）", "目標設計：compensate", "目標設計：BPMN 圖件（M2）", "第一切片", "目標設計：公開發布流程（Q4）", ""];
var CHS=[];STEPS.forEach(function(s,i){var g=CHS.find(function(c){return c.n===s.ch});if(!g){g={n:s.ch,w:s.w,items:[]};CHS.push(g)}g.items.push(i)});
function buildNav(){
  var h='';CHS.forEach(function(c){h+='<div class="grp"><div class="gt">W'+c.w+' · '+c.n+'</div>'+c.items.map(function(i){return '<button type="button" data-go="'+i+'" class="'+(i===S.i?'on':(i<S.i?'done':''))+'">'+(i+1)+'. '+STEPS[i].title.split('：')[0]+'</button>'}).join('')+'</div>'});
  document.getElementById('chnav').innerHTML=h;
  var w='';for(var k=0;k<=6;k++){var cw=STEPS[S.i].w;w+='<div class="'+(k===cw?'now':(k<cw?'past':''))+'">W'+k+'</div>'}
  document.getElementById('weeks').innerHTML=w;
}
function typeIn(){
  document.querySelectorAll('#stage .tx[data-type]').forEach(function(el){
    var t=el.getAttribute('data-type');
    if(!t){el.classList.add('ph');el.textContent='搜尋紀錄、輸入指令，或描述你要完成的事……';return}
    if(reduce){el.textContent=t;return}
    var n=0;el.innerHTML='<span></span><span class="caret"></span>';var sp=el.firstChild;
    var iv=setInterval(function(){n++;sp.textContent=t.slice(0,n);if(n>=t.length){clearInterval(iv)}},28);
  });
}
function runSources(){
  var box=document.querySelector('#stage .srcs[data-auto]');var gate=document.querySelectorAll('#stage .gated');
  if(!box){gate.forEach(function(g){g.classList.add('show')});return}
  var items=box.querySelectorAll('.src');var base=reduce?0:700;var gap=reduce?0:420;
  items.forEach(function(el,i){
    setTimeout(function(){el.classList.add('fetch');el.querySelector('.st').textContent='正在擷取來源'},base+i*gap);
    setTimeout(function(){el.classList.remove('fetch');el.classList.add('done');el.querySelector('.st').textContent='✓ 已擷取'},base+i*gap+(reduce?0:480));
  });
  setTimeout(function(){gate.forEach(function(g){g.classList.add('show')})},base+items.length*gap+(reduce?0:520));
}
function runHits(){
  document.querySelectorAll('#stage .hitme').forEach(function(el,i){setTimeout(function(){el.classList.add('hit')},reduce?0:200+i*140)});
}
function runTerm(){
  var t=document.getElementById('term');if(!t)return;
  t.querySelectorAll('.ln').forEach(function(l,i){setTimeout(function(){l.classList.add('show')},reduce?0:250+i*260)});
}
function render(){
  var s=STEPS[S.i];
  if(s.enter&&!s._entered){s.enter();s._entered=true}
  var p=PEOPLE[s.who];
  document.getElementById('where').textContent=s.where;
  document.getElementById('who').innerHTML='<span class="aiflag '+(S.ai?'c-act':'c-warn')+'">'+(S.ai?'● AI 可用':'○ AI 停用')+'</span><span>'+p.n+' · <span class="small">'+p.r+'</span></span><span class="av" style="background:'+p.c+'">'+p.n[0].toUpperCase()+'</span>';
  document.getElementById('stage').innerHTML=s.body();
  document.getElementById('sStep').innerHTML='第 '+(S.i+1)+' 步 · W'+s.w+' · '+s.ch+(TAGS[S.i]?'<br><span class="chip '+(TAGS[S.i].indexOf('第一切片')===0?'c-ok':'c-prop')+'" style="margin-top:4px;text-transform:none;letter-spacing:0">'+TAGS[S.i]+'</span>':'');
  document.getElementById('sTitle').textContent=s.title;
  document.getElementById('sWhat').textContent=s.what;
  var tr=document.getElementById('sTrad');tr.textContent=s.trad;tr.style.display=s.trad?'block':'none';
  document.getElementById('sRules').innerHTML=s.rules.map(function(r){return '<li>'+r+'</li>'}).join('');
  var cc={'M0':'c-ok','規劃':'c-act','新增':'c-prop'};
  document.getElementById('sCaps').innerHTML=s.caps.map(function(c){return '<span class="capi">'+c[0]+' <b class="'+cc[c[1]]+'">'+c[1]+'</b></span>'}).join('');
  document.getElementById('prog').textContent=(S.i+1)+' / '+STEPS.length;
  document.getElementById('prevB').disabled=S.i===0;
  document.getElementById('nextB').disabled=S.i===STEPS.length-1;
  buildNav();typeIn();runSources();runHits();runTerm();
}
function go(i){S.i=Math.max(0,Math.min(STEPS.length-1,i));render();var st=document.querySelector('.frame');if(st&&st.getBoundingClientRect().top<0)st.scrollIntoView({behavior:reduce?'auto':'smooth'})}

document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');if(g){go(+g.dataset.go);return}
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='next')go(S.i+1);
  else if(a==='sim'){var r=document.getElementById('simres');r.innerHTML='模擬完成：6 個測試案例 <b class="c-ok">全部符合預期</b>，沒有寫入任何正式資料。'}
  else if(a==='tryapprove'){document.getElementById('tryres').innerHTML='<span class="c-bad">● 不在 agent 的工具集合裡；就算直接呼叫 SPA 的 approve API，server 也會回 forbidden_op（approve／apply 的 handler 自己拒絕 agent，不只靠隱藏工具）。</span>'}
  else if(a==='saveview'){document.getElementById('mmres').innerHTML=C('c-ok','✓ 已存成個人 view「SSO 全景」')+' ViewDef v1：kind=mindmap, root=AUTH-140, child_rel=parent；推導群組只存在呈現設定裡'}
  else if(a==='mknode'){document.getElementById('mmres').innerHTML=C('c-prop','ChangeSet #14 已建立，待確認')+' 建立 story「錯誤頁文案」，parent = AUTH-140'}
  else if(a==='tryscreen'){document.getElementById('scrres').innerHTML='<span class="c-bad">● 不提供：擷取使用者目前的畫面不在 agent 的工具集合裡。</span> 這種畫面可能有側欄、未儲存的內容或其他任務。需要時，請 bob 在自己的瀏覽器主動截圖。'}
  else if(a==='tryflow'){document.getElementById('flowres').innerHTML='<span class="c-warn">● 不支援：BPMN 圖件不能直接發布成 workflow。</span> 要改流程，請到管理設定（草稿 → 影響報告 → 模擬 → 發布）。受限的 BPMN ↔ workflow 匯入匯出還沒決定（Q8）。'}
  else if(a==='why1'){document.getElementById('why1').classList.toggle('on')}
  else if(a==='stand'){b.outerHTML=C('c-ok','✓ 已發布到團隊（只含已確認內容）')}
  else if(a.indexOf('mkcs')===0){var k=a.slice(4);document.getElementById('mk'+k).innerHTML=C('c-prop','ChangeSet #'+(35+ +k)+' 已建立，待確認');b.disabled=true}
  else if(a==='vA'){S.viewer='alice';render()}
  else if(a==='vC'){S.viewer='carol';render()}
  else if(a==='restoreai'){S.ai=true;document.getElementById('tgAi').checked=true;go(S.i+1)}
  else if(a==='publish'){var c=document.getElementById('cfm');var r2=document.getElementById('pubres');
    if(!c||!c.checked){r2.innerHTML='<span class="c-warn">請先勾選確認。對外發布不能用一般的確認按鈕帶過。</span>';return}
    r2.innerHTML=C('c-ok','✓ 已發布')+' wiki「Release notes v2.0」· 通知 3 人 · operation_id op_7f3a';b.disabled=true}
  else if(a==='restart'){STEPS.forEach(function(s){s._entered=false});S.ai=true;S.conf=false;S.viewer='alice';document.getElementById('tgAi').checked=true;document.getElementById('tgConf').checked=false;go(0)}
});
document.getElementById('prevB').addEventListener('click',function(){go(S.i-1)});
document.getElementById('nextB').addEventListener('click',function(){go(S.i+1)});
document.getElementById('tgAi').addEventListener('change',function(e){S.ai=e.target.checked;render()});
document.getElementById('tgConf').addEventListener('change',function(e){S.conf=e.target.checked;render()});
document.addEventListener('keydown',function(e){if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')go(S.i+1);if(e.key==='ArrowLeft')go(S.i-1)});
var tb=document.getElementById('themeBtn');
try{var sv=localStorage.getItem('ox-theme');if(sv)document.documentElement.dataset.theme=sv}catch(e){}
tb.addEventListener('click',function(){var cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');var nx=cur==='light'?'dark':'light';document.documentElement.dataset.theme=nx;try{localStorage.setItem('ox-theme',nx)}catch(e){}});
render();
})();
</script>
