<!doctype html>
<html lang="zh-Hant-TW" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>oxledger</title>
		<script>
			try { let t = localStorage.getItem('ox.theme'); if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; if (t === 'high_contrast') t = 'hc'; if (t === 'light' || t === 'dark' || t === 'hc') document.documentElement.dataset.theme = t; } catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="false">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
